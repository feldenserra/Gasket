[workspace]
members = [
    "crates/gasket_cli",
    "crates/gasket_core",
    "crates/gasket_macros",
    "crates/gasket_ui",
    "examples/hello",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["The Gasket Authors"]
license-file = "LICENSE"
homepage = "https://github.com/feldenserra/Gasket"
documentation = "https://docs.rs/gasket-ui"
repository = "https://github.com/feldenserra/Gasket"

[workspace.dependencies]
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
eframe = "0.29"
# `path` is what this workspace builds. `version` is what `cargo publish` records.
# Keep `version` identical to workspace.package.version.
# Publish order: gasket-macros, gasket-core, gasket-ui, gasket-cli.
gasket-core = { version = "0.1.0", path = "crates/gasket_core" }
gasket-macros = { version = "0.1.0", path = "crates/gasket_macros" }
gasket-ui = { version = "0.1.0", path = "crates/gasket_ui" }
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
syn = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
