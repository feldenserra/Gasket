[package]
name = "gasket-cli"
description = "Gasket developer CLI"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license-file = "../../LICENSE"

# Published as `gasket-cli`. The crates.io name `gasket` already belongs to
# an unrelated project, so the binary is named `gasket` and the package is not.
[[bin]]
name = "gasket"
path = "src/main.rs"

[dependencies]
clap.workspace = true
